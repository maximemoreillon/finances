---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finances-env
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: finances-env-from-vault
    creationPolicy: Orphan
  dataFrom:
    - extract:
        key: finances
